name: branch-flow

# PR 타겟이 보호 브랜치(main/stage/develop)일 때 .github/BRANCHING.md의
# 소스 브랜치 규칙을 강제한다.
on:
  pull_request:
    branches: [main, stage, develop]

permissions:
  contents: read

jobs:
  check-branch-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Enforce branch flow
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: sh plugins/scv/vendor/scv-core/core/scripts/check-branch-flow.sh
      - name: Provenance gate
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash plugins/scv/vendor/scv-core/core/scripts/check-provenance.sh
