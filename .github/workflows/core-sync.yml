name: Check and vendor latest SCV Core

on:
  schedule:
    # Daily, matching scv-claude-code. This is only the fallback for a missed
    # repository_dispatch, but a weekly cadence made that fallback up to seven
    # days slow while the sibling wrapper recovered within a day.
    - cron: "23 1 * * *"
  repository_dispatch:
    types: [scv-core-released]
  workflow_dispatch:
    inputs:
      core_tag:
        description: "Optional scv-core release tag (blank = latest)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scv-core-sync
  cancel-in-progress: false

jobs:
  vendor:
    name: Open a core update PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.SCV_CORE_SYNC_TOKEN || github.token }}

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ secrets.SCV_CORE_SYNC_TOKEN || github.token }}
          # `tag` is the key scv-core's release workflow actually publishes; see
          # the repository_dispatch payload contract in the vendored
          # docs/wrapper-integration.md. `core_tag` remains the manual
          # workflow_dispatch input name and is unrelated to that contract.
          REQUESTED_TAG: ${{ inputs.core_tag || github.event.client_payload.tag || '' }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo wookiya1364/scv-core --json tagName -q .tagName)"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac
          version="${tag#v}"
          # Validate before the value reaches vendor-core.sh --tag. The sibling
          # wrapper applies the same pattern to its resolved version.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Refusing an unexpected scv-core tag: ${tag}" >&2
            exit 1
          fi
          current="$(
            python3 -c 'import json, pathlib; p = pathlib.Path("plugins/scv/vendor/scv-core/core.lock.json"); print(json.loads(p.read_text())["core_version"] if p.exists() else "")'
          )"
          artifact_sha="$(
            python3 -c 'import json, pathlib; p = pathlib.Path("plugins/scv/vendor/scv-core/core.lock.json"); print((json.loads(p.read_text()).get("artifact_sha256") or "") if p.exists() else "")'
          )"
          if [[ "$current" = "$version" &&
                "$artifact_sha" =~ ^[0-9a-f]{64}$ ]] &&
             bash tools/verify-core.sh >/dev/null 2>&1; then
            needed=false
          else
            needed=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Vendor the checksummed immutable release payload
        if: steps.release.outputs.needed == 'true'
        run: |
          bash tools/vendor-core.sh --tag "${{ steps.release.outputs.tag }}"

      - name: Verify core, adapter, plugin, and common behavior
        if: steps.release.outputs.needed == 'true'
        run: |
          bash tools/verify-core.sh
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          lock = json.loads(
              Path("plugins/scv/vendor/scv-core/core.lock.json").read_text()
          )
          assert re.fullmatch(r"[0-9a-f]{64}", lock["artifact_sha256"]), (
              "release vendoring must retain the verified tarball SHA-256"
          )
          PY
          bash plugins/scv/tests/test-codex-plugin.sh
          bash plugins/scv/tests/test-shared-core-adapter.sh
          bash plugins/scv/tests/test-apply-model-policy.sh
          bash plugins/scv/tests/test-vendor-core.sh
          bash plugins/scv/tests/test-vendor-core-atomicity.sh
          bash plugins/scv/vendor/scv-core/core/tests/run-dry.sh
          isolated_root="$(mktemp -d)"
          trap 'rm -rf "$isolated_root"' EXIT
          cp -R -p \
            plugins/scv/vendor/scv-core/core \
            "$isolated_root/core"
          for test_script in "$isolated_root"/core/tests/test-*.sh; do
            bash "$test_script"
          done
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(
            find \
              tools \
              plugins/scv/adapter \
              plugins/scv/tests \
              plugins/scv/vendor/scv-core/tools \
              plugins/scv/vendor/scv-core/core/scripts \
              plugins/scv/vendor/scv-core/core/tests \
              -type f -name '*.sh' -print0
          )
          python3 tools/validate-core-tree.py \
            --root plugins/scv/vendor/scv-core
          git diff --check

      - name: Open develop PR
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCV_CORE_SYNC_TOKEN || github.token }}
          CORE_VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.release.outputs.current }}
        run: |
          set -euo pipefail
          branch="chore/core-${CORE_VERSION}"
          BOT_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"

          # Read the remote tip BEFORE fetching. --force-with-lease with no
          # explicit value compares against the remote-tracking ref, so fetching
          # first refreshes the very thing the lease checks — leaving a plain
          # --force wearing a safer name.
          remote_sha="$(git ls-remote --heads origin "$branch" | cut -f1)"

          # Ask about the PR on every path, not only when the tree differs.
          open_pr="$(gh pr list --base develop --head "$branch" --state open \
            --json url --jq '.[0].url // ""')"
          declined_pr="$(gh pr list --base develop --head "$branch" --state closed \
            --json url,state --jq '[.[] | select(.state == "CLOSED")] | .[0].url // ""')"

          # A closed (not merged) PR is a maintainer declining this upgrade, and
          # the branch survives a close, so without this the next run rebuilds and
          # re-proposes it.
          #
          # The remote_sha condition is what makes the printed remedy true.
          # `gh pr list --head` matches the PR record's stored headRefName, which
          # GitHub keeps forever — deleting the branch does NOT clear the match.
          # Requiring the branch to still exist turns "delete it" into a real
          # escape instead of a permanent, silent stop.
          #
          # Warning, not notice: this also suppresses a same-version repair (the
          # pin is re-proposed when the vendored tree fails verification), and a
          # green run that quietly did nothing is the failure mode worth seeing.
          if [[ -n "$declined_pr" && -z "$open_pr" && -n "$remote_sha" ]]; then
            echo "::warning::${CORE_VERSION} was declined ($declined_pr) and $branch still exists, so it will not be re-proposed. Delete the branch to propose it again."
            exit 0
          fi

          git add plugins/scv tools

          # This wrapper vendors into one tree and materialises nothing outside
          # it, so a deletion elsewhere really is a fault. (The Claude wrapper
          # projects core into seven more trees and deletes there by design — the
          # same guard belongs only here.)
          stray_deletes="$(git diff --cached --name-only --diff-filter=D \
            | grep -v '^plugins/scv/vendor/scv-core/' || true)"
          if [[ -n "$stray_deletes" ]]; then
            echo "::error::Core sync would delete files outside the vendored payload:" >&2
            printf '%s\n' "$stray_deletes" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "$BOT_EMAIL"
          git switch -c "$branch"
          git commit -m "chore: vendor scv-core ${CORE_VERSION}"

          if [[ -z "$remote_sha" ]]; then
            git push origin "$branch"
          else
            git fetch --quiet origin \
              "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git diff --quiet "origin/$branch" HEAD; then
              # Rebuild a branch cut from an older develop — unless someone else
              # has been working there.
              #
              # %ce, not %ae. Git carries the original AUTHOR through amend,
              # rebase and cherry-pick, so a maintainer resolving a conflict on a
              # bot commit still reads as the bot by author. The committer is who
              # actually created the object, which is the question being asked.
              tip_committer="$(git log -1 --format='%ce' "origin/$branch")"
              if [[ "$tip_committer" != "$BOT_EMAIL" ]]; then
                # Skip, do not fail. Someone working on the branch is a normal
                # state, and a red nightly run for it trains people to ignore it.
                echo "::warning::$branch was last committed by $tip_committer, not this job — leaving it alone. Resolve it by hand, or delete the branch to let the sync rebuild it."
              elif ! git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "$branch"; then
                echo "::error::Could not refresh $branch — the remote moved after this run read it. Re-run the workflow." >&2
                exit 1
              else
                echo "::notice::Refreshed $branch onto current develop."
              fi
            fi
            # Whether or not the tree moved, an open PR means there is nothing
            # left to open. No open PR falls through to gh pr create below, which
            # is the recovery path for a branch whose PR creation once failed.
            if [[ -n "$open_pr" ]]; then
              echo "Existing core update PR: $open_pr"
              exit 0
            fi
          fi

          wrapper_version="$(tr -d '[:space:]' < VERSION)"
          body="$(
            printf '%s\n' \
              "Automated, pinned SCV Core update." \
              "" \
              "- Previous core: \`${PREVIOUS_VERSION:-none}\`" \
              "- New core: \`${CORE_VERSION}\`" \
              "- Wrapper release: \`${wrapper_version}\` (unchanged)" \
              "- Source: public \`wookiya1364/scv-core\` release" \
              "- Verification: release artifact SHA-256, payload checksums, lock, Core API, Codex adapter, plugin contract, shared regression" \
              "" \
              "This PR is intentionally not auto-merged. It follows \`chore/* → develop → stage → main\`."
          )"
          gh pr create \
            --base develop \
            --head "$branch" \
            --title "chore: vendor scv-core ${CORE_VERSION}" \
            --body "$body"

      - name: Already current
        if: steps.release.outputs.needed != 'true'
        run: |
          bash tools/verify-core.sh
          echo "SCV Core ${{ steps.release.outputs.version }} is already pinned and verified."
