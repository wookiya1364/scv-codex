name: Check and vendor latest SCV Core

on:
  schedule:
    - cron: "23 1 * * 1"
  repository_dispatch:
    types: [scv-core-released]
  workflow_dispatch:
    inputs:
      core_tag:
        description: "Optional scv-core release tag (blank = latest)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scv-core-sync
  cancel-in-progress: false

jobs:
  vendor:
    name: Open a core update PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v5
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.SCV_CORE_SYNC_TOKEN || github.token }}

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ secrets.SCV_CORE_SYNC_TOKEN || github.token }}
          REQUESTED_TAG: ${{ inputs.core_tag || github.event.client_payload.core_tag || '' }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo wookiya1364/scv-core --json tagName -q .tagName)"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac
          version="${tag#v}"
          current="$(
            python3 -c 'import json, pathlib; p = pathlib.Path("plugins/scv/vendor/scv-core/core.lock.json"); print(json.loads(p.read_text())["core_version"] if p.exists() else "")'
          )"
          artifact_sha="$(
            python3 -c 'import json, pathlib; p = pathlib.Path("plugins/scv/vendor/scv-core/core.lock.json"); print((json.loads(p.read_text()).get("artifact_sha256") or "") if p.exists() else "")'
          )"
          if [[ "$current" = "$version" &&
                "$artifact_sha" =~ ^[0-9a-f]{64}$ ]] &&
             bash tools/verify-core.sh >/dev/null 2>&1; then
            needed=false
          else
            needed=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Vendor the checksummed immutable release payload
        if: steps.release.outputs.needed == 'true'
        run: |
          bash tools/vendor-core.sh --tag "${{ steps.release.outputs.tag }}"

      - name: Verify core, adapter, plugin, and common behavior
        if: steps.release.outputs.needed == 'true'
        run: |
          bash tools/verify-core.sh
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          lock = json.loads(
              Path("plugins/scv/vendor/scv-core/core.lock.json").read_text()
          )
          assert re.fullmatch(r"[0-9a-f]{64}", lock["artifact_sha256"]), (
              "release vendoring must retain the verified tarball SHA-256"
          )
          PY
          bash plugins/scv/tests/test-codex-plugin.sh
          bash plugins/scv/tests/test-shared-core-adapter.sh
          bash plugins/scv/tests/test-apply-model-policy.sh
          bash plugins/scv/tests/test-vendor-core.sh
          bash plugins/scv/tests/test-vendor-core-atomicity.sh
          bash plugins/scv/vendor/scv-core/core/tests/run-dry.sh
          isolated_root="$(mktemp -d)"
          trap 'rm -rf "$isolated_root"' EXIT
          cp -R -p \
            plugins/scv/vendor/scv-core/core \
            "$isolated_root/core"
          for test_script in "$isolated_root"/core/tests/test-*.sh; do
            bash "$test_script"
          done
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(
            find \
              tools \
              plugins/scv/adapter \
              plugins/scv/tests \
              plugins/scv/vendor/scv-core/tools \
              plugins/scv/vendor/scv-core/core/scripts \
              plugins/scv/vendor/scv-core/core/tests \
              -type f -name '*.sh' -print0
          )
          python3 tools/validate-core-tree.py \
            --root plugins/scv/vendor/scv-core
          git diff --check

      - name: Open develop PR
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SCV_CORE_SYNC_TOKEN || github.token }}
          CORE_VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.release.outputs.current }}
        run: |
          set -euo pipefail
          branch="chore/core-${CORE_VERSION}"
          git add plugins/scv tools
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin \
              "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! git diff --cached --quiet "origin/$branch" -- \
                plugins/scv tools; then
              echo "::error::Remote branch $branch differs from the verified Core update." >&2
              exit 1
            fi
            pr_url="$(
              gh pr list \
                --base develop \
                --head "$branch" \
                --state open \
                --json url \
                --jq '.[0].url // ""'
            )"
            if [[ -n "$pr_url" ]]; then
              echo "Existing core update PR: $pr_url"
              exit 0
            fi
            echo "Reusing remote branch without an open PR: $branch"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git commit -m "chore: vendor scv-core ${CORE_VERSION}"
            git push origin "$branch"
          fi
          wrapper_version="$(tr -d '[:space:]' < VERSION)"
          body="$(
            printf '%s\n' \
              "Automated, pinned SCV Core update." \
              "" \
              "- Previous core: \`${PREVIOUS_VERSION:-none}\`" \
              "- New core: \`${CORE_VERSION}\`" \
              "- Wrapper release: \`${wrapper_version}\` (unchanged)" \
              "- Source: public \`wookiya1364/scv-core\` release" \
              "- Verification: release artifact SHA-256, payload checksums, lock, Core API, Codex adapter, plugin contract, shared regression" \
              "" \
              "This PR is intentionally not auto-merged. It follows \`chore/* → develop → stage → main\`."
          )"
          gh pr create \
            --base develop \
            --head "$branch" \
            --title "chore: vendor scv-core ${CORE_VERSION}" \
            --body "$body"

      - name: Already current
        if: steps.release.outputs.needed != 'true'
        run: |
          bash tools/verify-core.sh
          echo "SCV Core ${{ steps.release.outputs.version }} is already pinned and verified."
